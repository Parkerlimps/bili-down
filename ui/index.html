<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiliDown</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="3" width="20" height="16" rx="4" fill="#2563eb"/>
      <path d="M12 8v6m0 0l-2.4-2.4M12 14l2.4-2.4" stroke="#fff" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>BiliDown</span>
  </div>
  <div id="userArea" class="user"></div>
</header>

<main>
  <section class="hero">
    <h1>粘贴链接，下载视频</h1>
    <p class="sub">支持 BV 号、av 号、视频链接与 b23 短链</p>
    <div class="search">
      <input id="urlInput" spellcheck="false" autocomplete="off"
             placeholder="https://www.bilibili.com/video/BV...">
      <button id="parseBtn" class="primary">解析</button>
    </div>
  </section>

  <section id="card" class="card hidden">
    <div class="head">
      <div class="thumb"><img id="cover" alt=""></div>
      <div class="info">
        <h2 id="title"></h2>
        <div class="meta" id="meta"></div>
        <div class="meta dim" id="desc"></div>
      </div>
    </div>

    <div id="warn" class="warn hidden"></div>

    <div class="rows">
      <div class="row hidden" id="pageRow">
        <label>分 P</label>
        <select id="pageSel"></select>
      </div>
      <div class="row">
        <label>清晰度</label>
        <div class="chips" id="qnChips"></div>
      </div>
      <div class="row">
        <label>编码</label>
        <div class="chips" id="codecChips"></div>
      </div>
      <div class="row hidden" id="subRow">
        <label>字幕</label>
        <select id="subSel"></select>
      </div>
    </div>

    <div class="foot">
      <span class="est" id="est"></span>
      <button id="dlBtn" class="primary">开始下载</button>
    </div>
  </section>

  <section class="tasks">
    <div class="tasks-head">
      <span>任务</span>
      <button id="openDir" class="text">打开下载目录</button>
    </div>
    <div class="outbar">
      <span class="out-label">下载到</span>
      <span id="outDirText" class="out-path" title=""></span>
      <button id="changeDir" class="text">更改</button>
      <span id="outDirWarn" class="out-warn hidden">目录不可写</span>
    </div>
    <div id="taskList"></div>
    <div id="empty" class="empty">暂无任务</div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="dialog">
    <div class="dialog-head">
      <span>扫码登录</span>
      <button id="closeModal" class="x">×</button>
    </div>
    <div class="qr"><div id="qrBox"></div></div>
    <div class="tip" id="qrTip">正在获取二维码…</div>
    <div class="note">登录票据只保存在本机，用于获取账号权限内的清晰度</div>
  </div>
</div>

<div id="dirModal" class="modal hidden">
  <div class="dialog dir-dialog">
    <div class="dialog-head">
      <span>下载目录</span>
      <button id="closeDirModal" class="x">×</button>
    </div>
    <div class="dir-body">
      <p class="dir-tip">视频会保存到这个文件夹。设置只保存在本机，下次启动仍然有效；已在下载的任务不受影响。</p>
      <input id="dirInput" class="dir-input" spellcheck="false" autocomplete="off"
             placeholder="D:\Videos">
      <div class="dir-actions">
        <button id="browseDir" class="ghost">浏览…</button>
        <button id="saveDir" class="primary">保存</button>
      </div>
      <div class="dir-foot">
        <button id="resetDir" class="text">恢复默认</button>
        <span id="dirHint" class="dir-hint"></span>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
